x-api: &api
  restart: unless-stopped
  init: true
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=25)"]
    interval: 30s
    timeout: 30s
    start_period: 15s
    retries: 3

services:
  user:
    <<: *api
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE_NAME: user
    environment:
      SECRET_KEY: "${SECRET_KEY:?Set SECRET_KEY to a random value of at least 32 characters}"
    volumes:
      - users-data:/var/lib/globetrotter

  recommendation:
    <<: *api
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE_NAME: recommendation
    environment:
      GEOCODING_URL: "${GEOCODING_URL:-https://nominatim.openstreetmap.org/search}"
      GEOCODING_USER_AGENT: "${GEOCODING_USER_AGENT:-GlobeTrotterCameroon/1.0 (https://github.com/favourdotta-2/Favour-s-globetrotter)}"
      ROUTING_URL: "${ROUTING_URL:-https://router.project-osrm.org/route/v1/driving}"
      ROUTING_USER_AGENT: "${ROUTING_USER_AGENT:-GlobeTrotterCameroon/1.0 (https://github.com/favourdotta-2/Favour-s-globetrotter)}"
    volumes:
      - recommendations-data:/var/lib/globetrotter

  itinerary:
    <<: *api
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE_NAME: itinerary
    depends_on:
      user:
        condition: service_healthy
      recommendation:
        condition: service_healthy
    volumes:
      - itineraries-data:/var/lib/globetrotter

  chat:
    <<: *api
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE_NAME: chat
    depends_on:
      user:
        condition: service_healthy
    volumes:
      - chat-data:/var/lib/globetrotter

  gateway:
    <<: *api
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE_NAME: gateway
    environment:
      FRONTEND_ORIGIN: http://localhost:5173
    depends_on:
      user:
        condition: service_healthy
      recommendation:
        condition: service_healthy
      itinerary:
        condition: service_healthy
      chat:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    restart: unless-stopped
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "127.0.0.1:5173:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  users-data:
  itineraries-data:
  chat-data:
  recommendations-data:
