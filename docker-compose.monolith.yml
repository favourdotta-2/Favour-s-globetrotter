services:
  gateway:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE_NAME: monolith
    environment:
      SECRET_KEY: "${SECRET_KEY:?Set SECRET_KEY to a random value of at least 32 characters}"
      GEOCODING_URL: "${GEOCODING_URL:-https://nominatim.openstreetmap.org/search}"
      GEOCODING_USER_AGENT: "${GEOCODING_USER_AGENT:-GlobeTrotterCameroon/1.0 (https://github.com/favourdotta-2/Favour-s-globetrotter)}"
      ROUTING_URL: "${ROUTING_URL:-https://router.project-osrm.org/route/v1/driving}"
      ROUTING_USER_AGENT: "${ROUTING_USER_AGENT:-GlobeTrotterCameroon/1.0 (https://github.com/favourdotta-2/Favour-s-globetrotter)}"
    volumes:
      - monolith-data:/var/lib/globetrotter
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 3
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "127.0.0.1:5173:80"
volumes:
  monolith-data:
